name: Check Upstream Updates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check upstream changes
        env:
          PROJECT_REPOSITORY: ${{ github.repository }}
        run: |
          git remote add upstream https://github.com/Ouonnki/OuonnkiTV.git
          git fetch upstream main
          UPSTREAM_COUNT=$(git rev-list --count HEAD..upstream/main)
          {
            echo "## 上游更新参考"
            echo "上游有 ${UPSTREAM_COUNT} 个尚未包含在当前分支的提交。"
            echo "[查看差异](https://github.com/${PROJECT_REPOSITORY}/compare/main...Ouonnki:OuonnkiTV:main)"
            echo "工作流仅检查更新，不修改分支。请在独立分支选择并验证需要的变更。"
          } >> "$GITHUB_STEP_SUMMARY"
